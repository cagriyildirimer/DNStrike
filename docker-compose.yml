services:
  dnstrike:
    build: .
    user: "${DNSTRIKE_UID:-1000}:${DNSTRIKE_GID:-1000}"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DNSTRIKE_ADDR: 0.0.0.0:8080
      DNSTRIKE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
